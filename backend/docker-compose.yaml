
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: api-app
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: test_docker
      DB_USERNAME: laravel
      DB_PASSWORD: secret
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - php -r '$$socket = @fsockopen("127.0.0.1", 9000); exit($$socket ? 0 : 1);'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - ./:/var/www/html
    networks:
      - laravel-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: api-web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "3001:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - laravel-network

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: test_docker
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3309:3306"
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - laravel-network

  phpmyadmin-new:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:3002:80"
    networks:
      - laravel-network

networks:
  laravel-network:
    driver: bridge

volumes:
  mysql-data:
    driver: local
